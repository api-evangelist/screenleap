aid: screenleap
name: Screenleap
description: >-
  Screenleap is a screen sharing and online meeting service that lets anyone
  share their screen instantly from a browser with no software install required
  for viewers. Beyond the consumer product, Screenleap offers a REST-style
  developer API (api.screenleap.com/v2) that lets businesses embed live
  interaction — screen sharing, video conferencing, audio conferencing, chat and
  cloud recording — directly into their own websites and online services. The
  API creates and manages screen share sessions, returns a viewer URL and the
  screenShareData used by the screenleap.js JavaScript library to start sharing,
  and reports session usage and participant detail. Authentication uses an
  account id and auth token passed as request headers over SSL. Screenleap is
  backed by Andreessen Horowitz (a16z).
